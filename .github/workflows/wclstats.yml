name: Update WCL Stats Page

on:
  # GitHub's runners are datacenter IPs, and wclstats.com (Presto) serves them a
  # "Human Verification" bot wall, so the scrape can't run here. The daily refresh runs
  # on a residential machine via Windows Task Scheduler (see refresh.ps1 / SETUP-local.md).
  # Kept as manual-only in case Presto ever stops blocking datacenter IPs.
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: wcl-stats
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Regenerate page
        run: python generate.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Update WCL stats $(date -u +%Y-%m-%d)"
            git push
          fi
