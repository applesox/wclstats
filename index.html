<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCL 2026 — Standings & Expected Wins</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f4f6f8; color:#1d2733; font-family: Arial, Helvetica, sans-serif; font-size:13px; }
.wrap { max-width:1150px; margin:0 auto; padding:16px 12px 36px; }
h1 { font-size:19px; color:#243746; margin:0 0 2px; }
.sub { color:#5a6b78; font-size:12px; margin:0 0 4px; }
.asof { color:#1a769f; font-size:12px; font-weight:bold; margin:0 0 12px; }
.controls { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin:0 0 0 0; }
.tabs, .filters { display:flex; gap:6px; }
.tab { appearance:none; border:1px solid #cdd8df; border-bottom:none; background:#e6edf1; color:#3a4d5a;
       font-size:12.5px; font-weight:bold; padding:8px 16px; border-radius:8px 8px 0 0; cursor:pointer; }
.tab.active { background:#243746; color:#fff; border-color:#243746; }
.filters { margin-bottom:6px; }
.flt { appearance:none; border:1px solid #cdd8df; background:#fff; color:#3a4d5a; font-size:11.5px; font-weight:bold;
       padding:5px 12px; border-radius:14px; cursor:pointer; }
.flt.active { background:#1a769f; color:#fff; border-color:#1a769f; }
.scroll { overflow-x:auto; border-radius:0 8px 8px 8px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
table { width:100%; border-collapse:collapse; background:#fff; table-layout:fixed; }
th, td { padding:6px 4px; text-align:center; border-bottom:1px solid #e6ebee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
th { background:#243746; color:#fff; font-size:10.5px; text-transform:uppercase; font-weight:bold; cursor:pointer; user-select:none; }
th:hover { background:#2d4456; }
th .ar { font-size:8px; opacity:.55; margin-left:1px; }
th.act .ar { opacity:1; color:#7fd4ff; }
td.team, th.team { text-align:left; position:sticky; left:0; z-index:1; padding-left:8px; }
th.team { background:#243746; z-index:3; }
td.team { background:inherit; font-weight:bold; }
td.div { color:#6b7a85; font-weight:bold; }
tbody tr { background:#fff; }
tbody tr:nth-child(even) { background:#f0f5f8; }
tbody tr.sox { background:#fdf3e3; }
tbody tr.sox td.team { color:#243746; }
.pos { color:#0a8043; font-weight:bold; }
.neg { color:#c0392b; font-weight:bold; }
.zero { color:#5a6b78; }
.sep { border-left:2px solid #c9d6dd; }
.note { font-size:11px; color:#5a6b78; margin-top:13px; line-height:1.6; }
.cap { font-size:11px; color:#8595a0; padding-top:6px; text-align:right; }
</style>
</head>
<body>
<div class="wrap">
  <h1>West Coast League 2026 — Standings &amp; Expected Wins</h1>
  <p class="sub">Full league · source: wclstats.com (Presto) · click a header to sort</p>
  <p class="asof" id="asof"></p>
  <div class="filters">
    <button class="flt active" data-flt="all">All 16</button>
    <button class="flt" data-flt="N">North</button>
    <button class="flt" data-flt="S">South</button>
  </div>
  <div class="controls">
    <div class="tabs">
      <button class="tab active" data-tab="gen">Overview</button>
      <button class="tab" data-tab="off">Offense</button>
      <button class="tab" data-tab="pit">Pitching &amp; Defense</button>
    </div>
  </div>
  <div class="scroll">
    <table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  </div>
  <p class="cap" id="cap"></p>
  <p class="note" id="note"></p>
</div>
<script>
const ASOF = "Auto-updated Jun 28, 2026 3:20 AM PDT · source: wclstats.com (Presto)";
// [team,div,W,L,GP, AVG,OBP,SLG, RS,RA, oBB,oK, E,SB, ERA,IP,pBB,pK,WHIP,Fpct]
const DATA = [["Bellingham Bells", "N", 18, 8, 26, 0.274, 0.375, 0.376, 181, 134, 118, 191, 26, 39, 4.21, 235.1, 135, 204, 1.34, 0.974], ["Wenatchee AppleSox", "N", 18, 8, 26, 0.263, 0.393, 0.371, 189, 128, 147, 194, 35, 40, 3.95, 227.2, 100, 229, 1.39, 0.964], ["Nanaimo NightOwls", "N", 15, 11, 26, 0.235, 0.347, 0.337, 150, 173, 113, 235, 33, 31, 5.54, 230.2, 114, 183, 1.53, 0.966], ["Kelowna Falcons", "N", 13, 10, 23, 0.27, 0.38, 0.385, 145, 105, 109, 156, 27, 34, 3.56, 202.0, 74, 175, 1.31, 0.968], ["Victoria HarbourCats", "N", 12, 11, 23, 0.293, 0.395, 0.414, 151, 142, 111, 166, 34, 61, 4.57, 204.2, 120, 223, 1.46, 0.959], ["Edmonton Riverhawks", "N", 11, 12, 23, 0.259, 0.389, 0.38, 158, 128, 128, 193, 37, 37, 4.66, 197.0, 123, 155, 1.53, 0.957], ["Kamloops NorthPaws", "N", 9, 14, 23, 0.26, 0.366, 0.4, 145, 164, 102, 186, 32, 51, 5.96, 199.1, 116, 147, 1.67, 0.962], ["Port Angeles Lefties", "N", 5, 21, 26, 0.233, 0.335, 0.323, 106, 210, 93, 202, 37, 21, 6.28, 222.0, 156, 215, 1.84, 0.958], ["Ridgefield Raptors", "S", 18, 7, 25, 0.266, 0.4, 0.415, 187, 134, 146, 212, 22, 44, 4.99, 222.0, 126, 203, 1.45, 0.977], ["Walla Walla Sweets", "S", 15, 11, 26, 0.252, 0.371, 0.391, 181, 149, 115, 207, 35, 52, 4.73, 226.1, 118, 247, 1.48, 0.961], ["Corvallis Knights", "S", 12, 11, 23, 0.244, 0.375, 0.316, 128, 136, 134, 196, 32, 40, 4.61, 207.0, 123, 210, 1.58, 0.963], ["Yakima Valley Pippins", "S", 12, 14, 26, 0.262, 0.379, 0.379, 166, 179, 144, 218, 38, 38, 5.92, 228.0, 165, 232, 1.68, 0.96], ["Marion Berries", "S", 11, 14, 25, 0.23, 0.382, 0.356, 164, 184, 156, 240, 42, 61, 6.05, 220.0, 130, 199, 1.69, 0.956], ["Portland Pickles", "S", 9, 12, 21, 0.252, 0.398, 0.341, 127, 127, 128, 190, 28, 42, 5.14, 184.0, 121, 175, 1.6, 0.965], ["Bend Elks", "S", 9, 13, 22, 0.241, 0.366, 0.307, 122, 165, 118, 176, 39, 34, 5.81, 192.0, 151, 188, 1.84, 0.952], ["Springfield Drifters", "S", 6, 16, 22, 0.239, 0.369, 0.317, 130, 172, 136, 212, 30, 47, 6.48, 194.1, 126, 189, 1.7, 0.963]];

const rows = DATA.map(d => {
  const [t,dv,W,L,GP,AVG,OBP,SLG,RS,RA,oBB,oK,E,SB,ERA,IP,pBB,pK,WHIP,Fpct]=d;
  const g=W+L, pct=g?W/g:0;
  const exPct=(RS+RA)?Math.pow(RS,2)/(Math.pow(RS,2)+Math.pow(RA,2)):0;
  return {t,dv,W,L,pct,AVG,OBP,ops:OBP+SLG,RS,RA,oBB,oK,E,SB,ERA,IP,pBB,pK,WHIP,Fpct,
          diff:RS-RA, exW:exPct*GP, luck:W-exPct*GP};
});

const f3=x=>x.toFixed(3).replace(/^0/,'');
const signed=(v,dec)=>{ if(Math.abs(v)<(dec?0.05:0.5)) return `<span class="zero">${dec?'0.0':'0'}</span>`;
  return `<span class="${v>0?'pos':'neg'}">${(v>0?'+':'')+v.toFixed(dec)}</span>`; };

const TEAMCOL={k:'t',l:'Team',w:22,r:r=>r.t,dir:1,team:1};
const DIVCOL={k:'dv',l:'Div',w:6,r:r=>`<span class="div">${r.dv}</span>`,dir:1};

const TABS={
  gen:[TEAMCOL,DIVCOL,
    {k:'W',l:'W',w:6,r:r=>r.W,dir:-1},
    {k:'L',l:'L',w:6,r:r=>r.L,dir:1},
    {k:'pct',l:'PCT',w:8,r:r=>f3(r.pct),dir:-1},
    {k:'RS',l:'RS',w:7,sep:1,r:r=>r.RS,dir:-1},
    {k:'RA',l:'RA',w:7,r:r=>r.RA,dir:1},
    {k:'diff',l:'Diff',w:8,r:r=>signed(r.diff,0),dir:-1},
    {k:'exW',l:'Exp W',w:8,sep:1,r:r=>r.exW.toFixed(1),dir:-1},
    {k:'luck',l:'+/-Exp',w:9,r:r=>signed(r.luck,1),dir:-1}],
  off:[TEAMCOL,DIVCOL,
    {k:'AVG',l:'AVG',w:8,sep:1,r:r=>f3(r.AVG),dir:-1},
    {k:'OBP',l:'OBP',w:8,r:r=>f3(r.OBP),dir:-1},
    {k:'ops',l:'OPS',w:8,r:r=>f3(r.ops),dir:-1},
    {k:'RS',l:'RS',w:7,sep:1,r:r=>r.RS,dir:-1},
    {k:'SB',l:'SB',w:6,r:r=>r.SB,dir:-1},
    {k:'oBB',l:'BB',w:6,sep:1,r:r=>r.oBB,dir:-1},
    {k:'oK',l:'K',w:6,r:r=>r.oK,dir:1}],
  pit:[TEAMCOL,DIVCOL,
    {k:'ERA',l:'ERA',w:8,sep:1,r:r=>r.ERA.toFixed(2),dir:1},
    {k:'RA',l:'RA',w:7,r:r=>r.RA,dir:1},
    {k:'WHIP',l:'WHIP',w:8,r:r=>r.WHIP.toFixed(2),dir:1},
    {k:'pK',l:'K',w:6,sep:1,r:r=>r.pK,dir:-1},
    {k:'pBB',l:'BB',w:6,r:r=>r.pBB,dir:1},
    {k:'E',l:'E',w:6,sep:1,r:r=>r.E,dir:1},
    {k:'Fpct',l:'F%',w:8,r:r=>f3(r.Fpct),dir:-1}]
};
const DEFAULT={gen:['W',-1], off:['ops',-1], pit:['ERA',1]};

let tab='gen', flt='all', sortKey='W', sortDir=-1;

function render(){
  const cols=TABS[tab];
  document.getElementById('head').innerHTML=cols.map(c=>{
    const act=c.k===sortKey, ar=act?(sortDir<0?'▼':'▲'):'';
    return `<th data-k="${c.k}" style="width:${c.w}%" class="${c.team?'team':''} ${c.sep?'sep':''} ${act?'act':''}">${c.l}<span class="ar">${ar}</span></th>`;
  }).join('');
  document.querySelectorAll('#head th').forEach(th=>th.addEventListener('click',()=>{
    const k=th.getAttribute('data-k');
    if(k===sortKey) sortDir=-sortDir; else {sortKey=k; sortDir=cols.find(c=>c.k===k).dir;}
    render();
  }));
  const view=rows.filter(r=>flt==='all'||r.dv===flt).sort((a,b)=>{
    let av=a[sortKey],bv=b[sortKey];
    return typeof av==='string'?av.localeCompare(bv)*sortDir:(av-bv)*sortDir;
  });
  document.getElementById('body').innerHTML=view.map(r=>`
    <tr class="${r.t==='Wenatchee AppleSox'?'sox':''}">
      ${cols.map(c=>`<td class="${c.team?'team':''} ${c.sep?'sep':''}">${c.r(r)}</td>`).join('')}
    </tr>`).join('');
}

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tab=b.getAttribute('data-tab');
  [sortKey,sortDir]=DEFAULT[tab]; render();
}));
document.querySelectorAll('.flt').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.flt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); flt=b.getAttribute('data-flt'); render();
}));

document.getElementById('asof').textContent=ASOF;
render();
document.getElementById('cap').textContent=`Rendered ${new Date().toLocaleString()}`;
document.getElementById('note').innerHTML=
  `<b>Overview</b>: W-L-PCT, runs scored/allowed, run differential, and Pythagorean expected wins. ` +
  `<b>Exp W</b> = [RS&sup2;/(RS&sup2;+RA&sup2;)] &times; games; <b>+/-Exp</b> &gt; 0 = lucky, &lt; 0 = underperforming. ` +
  `<b>Offense</b>: AVG, OBP, OPS, RS, SB, batting walks (BB) and strikeouts (K). ` +
  `<b>Pitching &amp; Defense</b>: ERA, RA, WHIP, staff strikeouts (K) and walks (BB), errors (E), fielding % (F%). ` +
  `Filter by division with the pills up top. Data source: wclstats.com (Presto).`;
</script>
</body>
</html>
