<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WCL 2026 — Standings & Expected Wins</title>
<style>
:root { color-scheme: light; }
* { box-sizing: border-box; }
body { margin:0; background:#f4f6f8; color:#1d2733; font-family: Arial, Helvetica, sans-serif; font-size:13px; }
.wrap { max-width:1150px; margin:0 auto; padding:16px 12px 36px; }
h1 { font-size:19px; color:#243746; margin:0 0 2px; }
.sub { color:#5a6b78; font-size:12px; margin:0 0 4px; }
.asof { color:#1a769f; font-size:12px; font-weight:bold; margin:0 0 12px; }
.controls { display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; margin:0 0 0 0; }
.tabs, .filters { display:flex; gap:6px; flex-wrap:wrap; }
.tab { appearance:none; border:1px solid #cdd8df; border-bottom:none; background:#e6edf1; color:#3a4d5a;
       font-size:12.5px; font-weight:bold; padding:8px 16px; border-radius:8px 8px 0 0; cursor:pointer; }
.tab.active { background:#243746; color:#fff; border-color:#243746; }
.filters { margin-bottom:6px; }
.flt { appearance:none; border:1px solid #cdd8df; background:#fff; color:#3a4d5a; font-size:11.5px; font-weight:bold;
       padding:5px 12px; border-radius:14px; cursor:pointer; }
.flt.active { background:#1a769f; color:#fff; border-color:#1a769f; }
.scroll { overflow-x:auto; border-radius:0 8px 8px 8px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
table { width:100%; border-collapse:collapse; background:#fff; table-layout:fixed; }
th, td { padding:6px 4px; text-align:center; border-bottom:1px solid #e6ebee; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
th { background:#243746; color:#fff; font-size:10.5px; text-transform:uppercase; font-weight:bold; cursor:pointer; user-select:none; }
th:hover { background:#2d4456; }
th .ar { font-size:8px; opacity:.55; margin-left:1px; }
th.act .ar { opacity:1; color:#7fd4ff; }
td.team, th.team { text-align:left; position:sticky; left:0; z-index:1; padding-left:8px; }
th.team { background:#243746; z-index:3; }
td.team { background:inherit; font-weight:bold; }
td.rank { color:#8595a0; font-weight:bold; }
td.div { color:#6b7a85; font-weight:bold; }
tbody tr { background:#fff; }
tbody tr:nth-child(even) { background:#f0f5f8; }
tbody tr.sox { background:#fdf3e3; }
tbody tr.sox td.team { color:#243746; }
tbody tr.leader td.team::after { content:" \2726"; color:#0a8043; }
.pos { color:#0a8043; font-weight:bold; }
.neg { color:#c0392b; font-weight:bold; }
.zero { color:#5a6b78; }
.pct { font-weight:bold; }
.gbzero { color:#5a6b78; }
.sep { border-left:2px solid #c9d6dd; }
.badge { display:inline-block; font-size:9px; font-weight:bold; color:#0a8043; border:1px solid #0a8043;
         border-radius:8px; padding:1px 5px; margin-left:6px; vertical-align:middle; letter-spacing:.02em; }
.note { font-size:11px; color:#5a6b78; margin-top:13px; line-height:1.6; }
.cap { font-size:11px; color:#8595a0; padding-top:6px; text-align:right; }
/* Presto-style league branding */
.brandbar { display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin:0 0 10px; }
.wcl-logo { height:54px; width:auto; display:block; }
.brandtxt { flex:1 1 240px; min-width:0; }
.brandtxt h1 { margin:0 0 2px; }
.brandtxt .sub { margin:0; }
.presto-link { margin-left:auto; align-self:center; background:#1a769f; color:#fff; text-decoration:none;
               font-weight:bold; font-size:12px; padding:8px 14px; border-radius:6px; white-space:nowrap; }
.presto-link:hover { background:#155f80; }
.credits { font-size:11px; color:#7d8b95; margin-top:14px; border-top:1px solid #e1e8ec; padding-top:10px; line-height:1.6; }
.credits a { color:#1a769f; text-decoration:none; font-weight:bold; }
.credits a:hover { text-decoration:underline; }
/* Embed mode (?embed=1): blend into a host page by dropping the page background
   and the page's own branding, since the host supplies those. */
html.embed, html.embed body { background:transparent; }
html.embed .wrap { padding:6px 10px 20px; }
html.embed .brandbar, html.embed .credits { display:none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar">
    <img class="wcl-logo" src="wcl-logo.png" alt="West Coast League" />
    <div class="brandtxt">
      <h1>West Coast League 2026 — Standings &amp; Expected Wins</h1>
      <p class="sub">Full league · click a header to sort</p>
    </div>
    <a class="presto-link" href="https://wclstats.com/sports/bsb/2026/standings" target="_blank" rel="noopener">Official stats on wclstats.com &rarr;</a>
  </div>
  <p class="asof" id="asof"></p>
  <div class="filters">
    <button class="flt active" data-flt="N">North</button>
    <button class="flt" data-flt="S">South</button>
    <button class="flt" data-flt="all">All 16</button>
  </div>
  <div class="controls">
    <div class="tabs">
      <button class="tab active" data-tab="full">Full Season</button>
      <button class="tab" data-tab="second">Second Half</button>
      <button class="tab" data-tab="first">First Half</button>
      <button class="tab" data-tab="expw">EXP W</button>
      <button class="tab" data-tab="off">Offense</button>
      <button class="tab" data-tab="pit">Pitching &amp; Defense</button>
    </div>
  </div>
  <div class="scroll">
    <table><thead><tr id="head"></tr></thead><tbody id="body"></tbody></table>
  </div>
  <p class="cap" id="cap"></p>
  <p class="note" id="note"></p>
  <p class="credits">
    Standings and statistics are provided by
    <a href="https://wclstats.com" target="_blank" rel="noopener">wclstats.com</a>,
    the official statistics site of the West Coast League, powered by
    <a href="https://www.prestosports.com" target="_blank" rel="noopener">PrestoSports</a>.
  </p>
</div>
<script>
/* Stats auto-update stamp (nightly Presto scrape). */
const ASOF = "Auto-updated Jul 18, 2026 9:39 PM PDT · source: wclstats.com (Presto)";
/* Standings data currency (live if the standings scrape succeeded, else snapshot). */
const STAND_ASOF = "Overall standings live from wclstats.com (Presto) · first half final";
/* Stats + overall W-L, one row per team:
   [team,div,W,L,GP, AVG,OBP,SLG, RS,RA, oBB,oK, E,SB, ERA,IP,pBB,pK,WHIP,Fpct] */
const DATA = [["Wenatchee AppleSox", "N", 27, 11, 38, 0.274, 0.405, 0.383, 286, 177, 225, 280, 49, 61, 3.58, 334.2, 134, 352, 1.35, 0.965, "Won 1", "7-3"], ["Kelowna Falcons", "N", 23, 15, 38, 0.265, 0.373, 0.369, 255, 174, 180, 261, 50, 65, 3.61, 334.1, 132, 288, 1.31, 0.965, "Won 1", "6-4"], ["Nanaimo NightOwls", "N", 23, 18, 41, 0.243, 0.352, 0.343, 234, 253, 184, 379, 61, 52, 5.19, 360.2, 189, 285, 1.53, 0.96, "Lost 1", "6-4"], ["Bellingham Bells", "N", 22, 15, 37, 0.271, 0.366, 0.368, 240, 184, 156, 268, 39, 53, 3.96, 331.2, 176, 292, 1.36, 0.972, "Lost 1", "3-7"], ["Edmonton Riverhawks", "N", 21, 17, 38, 0.269, 0.385, 0.388, 259, 232, 191, 328, 58, 58, 5.06, 329.0, 192, 297, 1.57, 0.959, "Lost 1", "7-3"], ["Victoria HarbourCats", "N", 19, 19, 38, 0.277, 0.384, 0.395, 246, 218, 192, 280, 48, 107, 4.41, 338.2, 189, 395, 1.43, 0.965, "Lost 1", "5-5"], ["Kamloops NorthPaws", "N", 15, 22, 37, 0.249, 0.36, 0.374, 218, 282, 168, 304, 64, 72, 6.12, 319.1, 195, 235, 1.73, 0.953, "Won 1", "4-6"], ["Port Angeles Lefties", "N", 9, 29, 38, 0.249, 0.347, 0.347, 170, 304, 134, 302, 58, 21, 6.34, 325.0, 237, 305, 1.82, 0.956, "Won 1", "3-7"], ["Walla Walla Sweets", "S", 24, 16, 40, 0.263, 0.374, 0.399, 285, 226, 178, 307, 55, 65, 4.83, 350.0, 183, 353, 1.49, 0.961, "Won 4", "8-2"], ["Ridgefield Raptors", "S", 21, 17, 38, 0.266, 0.39, 0.411, 265, 240, 204, 313, 45, 55, 5.58, 330.2, 202, 297, 1.58, 0.968, "Won 1", "1-9"], ["Portland Pickles", "S", 19, 17, 36, 0.263, 0.397, 0.369, 231, 227, 206, 306, 46, 79, 5.46, 313.0, 199, 295, 1.57, 0.966, "Won 2", "6-4"], ["Corvallis Knights", "S", 19, 18, 37, 0.249, 0.377, 0.336, 209, 208, 206, 288, 52, 62, 4.62, 329.1, 187, 348, 1.54, 0.962, "Lost 1", "6-4"], ["Yakima Valley Pippins", "S", 17, 20, 37, 0.258, 0.377, 0.364, 239, 280, 206, 294, 64, 57, 6.31, 325.0, 224, 307, 1.75, 0.953, "Lost 4", "5-5"], ["Bend Elks", "S", 15, 23, 38, 0.233, 0.351, 0.301, 186, 254, 189, 336, 72, 61, 5.37, 327.0, 234, 313, 1.7, 0.949, "Lost 1", "3-7"], ["Marion Berries", "S", 14, 22, 36, 0.221, 0.373, 0.337, 222, 259, 223, 353, 55, 79, 5.87, 315.2, 187, 280, 1.7, 0.96, "Lost 2", "2-8"], ["Springfield Drifters", "S", 14, 23, 37, 0.237, 0.365, 0.313, 207, 234, 213, 329, 42, 59, 5.31, 320.1, 195, 286, 1.58, 0.968, "Won 1", "5-5"]];

/* ------------------------------------------------------------------
   FIRST-HALF RECORDS — FINAL / FROZEN. These never change; Presto only
   publishes overall totals, so the first-half split is carried here from
   the WCL playoff-picture spreadsheet. Second half = Overall - First Half.
   { team: [W, L] }
------------------------------------------------------------------- */
const FIRSTHALF = {
  "Wenatchee AppleSox":   [19,  8],
  "Kelowna Falcons":      [16, 11],
  "Bellingham Bells":     [19,  8],
  "Nanaimo NightOwls":    [15, 12],
  "Edmonton Riverhawks":  [14, 12],
  "Victoria HarbourCats": [14, 13],
  "Kamloops NorthPaws":   [11, 16],
  "Port Angeles Lefties": [ 5, 21],
  "Ridgefield Raptors":   [20,  7],
  "Walla Walla Sweets":   [15, 12],
  "Corvallis Knights":    [13, 14],
  "Yakima Valley Pippins":[12, 15],
  "Portland Pickles":     [11, 13],
  "Bend Elks":            [11, 14],
  "Marion Berries":       [12, 14],
  "Springfield Drifters": [ 9, 18]
};

/* ---- stats rows (EXP W / Offense / Pitching) ---- */
const rows = DATA.map(d => {
  const [t,dv,W,L,GP,AVG,OBP,SLG,RS,RA,oBB,oK,E,SB,ERA,IP,pBB,pK,WHIP,Fpct]=d;
  const g=W+L, pct=g?W/g:0;
  const exPct=(RS+RA)?Math.pow(RS,2)/(Math.pow(RS,2)+Math.pow(RA,2)):0;
  return {t,dv,W,L,pct,AVG,OBP,ops:OBP+SLG,RS,RA,oBB,oK,E,SB,ERA,IP,pBB,pK,WHIP,Fpct,
          diff:RS-RA, exW:exPct*GP, luck:W-exPct*GP};
});

/* ---- standings splits (Full Season / Second Half / First Half) ---- */
const STAND = DATA.map(d => {
  const t=d[0], dv=d[1], ovW=d[2], ovL=d[3];
  const [f1W,f1L] = FIRSTHALF[t] || [0,0];
  return { t, dv,
    first:  { W:f1W,      L:f1L },
    second: { W:ovW-f1W,  L:ovL-f1L },
    overall:{ W:ovW,      L:ovL },
    sk: d[20]||'', l10: d[21]||'' };   // overall streak + last-10, mirrored from Presto
});

const f3=x=>x.toFixed(3).replace(/^0/,'');
const signed=(v,dec)=>{ if(Math.abs(v)<(dec?0.05:0.5)) return `<span class="zero">${dec?'0.0':'0'}</span>`;
  return `<span class="${v>0?'pos':'neg'}">${(v>0?'+':'')+v.toFixed(dec)}</span>`; };
const pctOf=r=>{ const g=r.W+r.L; return g? r.W/g : 0; };

/* Games-behind vs the leader of the SAME division for the active split. */
function computeStanding(split){
  const list = STAND.map(o => { const r=o[split]; return {t:o.t, dv:o.dv, W:r.W, L:r.L, pct:pctOf(r), sk:o.sk, l10:o.l10}; });
  ["N","S"].forEach(dv => {
    const grp = list.filter(r=>r.dv===dv);
    const lead = grp.slice().sort((a,b)=> b.pct-a.pct || a.L-b.L || b.W-a.W)[0];
    grp.forEach(r => { r.gb=((lead.W-r.W)+(r.L-lead.L))/2; r.leader=(r===lead); });
  });
  return list;
}

const TEAMCOL={k:'t',l:'Team',w:22,r:r=>r.t,dir:1,team:1};
const DIVCOL ={k:'dv',l:'Div',w:6,r:r=>`<span class="div">${r.dv}</span>`,dir:1};

/* Standings columns (shared by full/second/first). */
const RANKCOL={k:'rank',l:'#',w:4,dir:1,cls:'rank',r:(r,i)=>i+1};
const GBCOL={k:'gb',l:'GB',dir:1,sep:1,r:r=> r.gb===0 ? '<span class="gbzero">&mdash;</span>' : r.gb.toFixed(1)};
const STREAKCOL={k:'sk',l:'Streak',dir:1,sep:1,r:r=>r.sk||'&mdash;'};
const L10COL={k:'l10',l:'Last 10',dir:1,r:r=>r.l10||'&mdash;'};
// Full Season mirrors the Presto overall table (adds Streak + Last 10);
// the derived half-season tabs stay W-L-PCT-GB.
const STAND_COLS={
  full: [ RANKCOL, {...TEAMCOL,w:24}, DIVCOL,
    {k:'W',l:'W',w:7,dir:-1,sep:1,r:r=>r.W},
    {k:'L',l:'L',w:7,dir:1,r:r=>r.L},
    {k:'pct',l:'PCT',w:9,dir:-1,cls:'pct',r:r=>f3(r.pct)},
    {...STREAKCOL,w:15}, {...L10COL,w:14}, {...GBCOL,w:14} ],
  second: [ {...RANKCOL,w:5}, {...TEAMCOL,w:34}, DIVCOL,
    {k:'W',l:'W',w:10,dir:-1,sep:1,r:r=>r.W},
    {k:'L',l:'L',w:10,dir:1,r:r=>r.L},
    {k:'pct',l:'PCT',w:16,dir:-1,cls:'pct',r:r=>f3(r.pct)},
    {...GBCOL,w:18} ]
};
STAND_COLS.first = STAND_COLS.second;

const STAT_TABS={
  expw:[TEAMCOL,DIVCOL,
    {k:'W',l:'W',w:6,r:r=>r.W,dir:-1},
    {k:'L',l:'L',w:6,r:r=>r.L,dir:1},
    {k:'pct',l:'PCT',w:8,r:r=>f3(r.pct),dir:-1},
    {k:'RS',l:'RS',w:7,sep:1,r:r=>r.RS,dir:-1},
    {k:'RA',l:'RA',w:7,r:r=>r.RA,dir:1},
    {k:'diff',l:'Diff',w:8,r:r=>signed(r.diff,0),dir:-1},
    {k:'exW',l:'Exp W',w:8,sep:1,r:r=>r.exW.toFixed(1),dir:-1},
    {k:'luck',l:'+/-Exp',w:9,r:r=>signed(Math.round(r.luck),0),dir:-1}],
  off:[TEAMCOL,DIVCOL,
    {k:'AVG',l:'AVG',w:8,sep:1,r:r=>f3(r.AVG),dir:-1},
    {k:'OBP',l:'OBP',w:8,r:r=>f3(r.OBP),dir:-1},
    {k:'ops',l:'OPS',w:8,r:r=>f3(r.ops),dir:-1},
    {k:'RS',l:'RS',w:7,sep:1,r:r=>r.RS,dir:-1},
    {k:'SB',l:'SB',w:6,r:r=>r.SB,dir:-1},
    {k:'oBB',l:'BB',w:6,sep:1,r:r=>r.oBB,dir:-1},
    {k:'oK',l:'K',w:6,r:r=>r.oK,dir:1}],
  pit:[TEAMCOL,DIVCOL,
    {k:'ERA',l:'ERA',w:8,sep:1,r:r=>r.ERA.toFixed(2),dir:1},
    {k:'RA',l:'RA',w:7,r:r=>r.RA,dir:1},
    {k:'WHIP',l:'WHIP',w:8,r:r=>r.WHIP.toFixed(2),dir:1},
    {k:'pK',l:'K',w:6,sep:1,r:r=>r.pK,dir:-1},
    {k:'pBB',l:'BB',w:6,r:r=>r.pBB,dir:1},
    {k:'E',l:'E',w:6,sep:1,r:r=>r.E,dir:1},
    {k:'Fpct',l:'F%',w:8,r:r=>f3(r.Fpct),dir:-1}]
};

const SPLIT={full:'overall', second:'second', first:'first'};
const isStanding=t=>t in SPLIT;
const STAT_DEFAULT={expw:['W',-1], off:['ops',-1], pit:['ERA',1]};

let tab='full', flt='N', sortKey='pct', sortDir=-1;

/* Embed support: ?embed=1 hides the page's own title; postHeight() lets a host
   page (westcoastleague.com) auto-size the iframe as tabs/filters change. */
const EMBED = new URLSearchParams(location.search).has('embed');
if (EMBED) document.documentElement.classList.add('embed');
function postHeight(){
  try {
    const el = document.querySelector('.wrap');
    const h = Math.ceil((el ? el.getBoundingClientRect().height : document.body.scrollHeight) + 16);
    if (window.parent !== window) parent.postMessage({ wclstatsHeight: h }, '*');
  } catch(e){}
}

function render(){
  const standing=isStanding(tab);
  const cols = standing ? STAND_COLS[tab] : STAT_TABS[tab];

  document.getElementById('head').innerHTML=cols.map(c=>{
    const act=c.k===sortKey, ar=act?(sortDir<0?'▼':'▲'):'';
    return `<th data-k="${c.k}" style="width:${c.w}%" class="${c.team?'team':''} ${c.sep?'sep':''} ${act?'act':''}">${c.l}<span class="ar">${ar}</span></th>`;
  }).join('');
  document.querySelectorAll('#head th').forEach(th=>th.addEventListener('click',()=>{
    const k=th.getAttribute('data-k');
    if(k===sortKey) sortDir=-sortDir; else {sortKey=k; sortDir=cols.find(c=>c.k===k).dir;}
    render();
  }));

  let view = standing ? computeStanding(SPLIT[tab]) : rows;
  view = view.filter(r=> flt==='all' || r.dv===flt).slice().sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(typeof av==='string') return av.localeCompare(bv)*sortDir;
    return (av-bv)*sortDir || (b.pct-a.pct) || (a.L-b.L);
  });

  document.getElementById('body').innerHTML=view.map((r,i)=>{
    const isSox = r.t==='Wenatchee AppleSox';
    const isChamp = standing && tab==='first' && r.leader;
    const cls=[isSox?'sox':'', isChamp?'leader':''].join(' ').trim();
    const badge = isChamp ? '<span class="badge">1H CHAMP &middot; BERTH</span>' : '';
    return `<tr class="${cls}">${
      cols.map(c=>{
        const val = (c.k==='rank') ? c.r(r,i) : c.r(r);
        const extra = c.team ? badge : '';
        return `<td class="${c.team?'team':''} ${c.cls||''} ${c.sep?'sep':''}">${val}${extra}</td>`;
      }).join('')
    }</tr>`;
  }).join('');

  document.getElementById('note').innerHTML = NOTE[tab];
  document.getElementById('asof').textContent = standing ? STAND_ASOF : ASOF;
  postHeight();
}

const NOTE={
  full: `<b>Full Season</b>: overall W-L-PCT for all 16 clubs, mirrored from the official standings on wclstats.com (Presto). ` +
    `GB is games behind the division leader. Filter by division with the pills up top.`,
  second: `<b>Second Half</b> (in progress): each club's overall record minus its final first-half record, so it updates ` +
    `automatically as overall totals refresh. The second-half champion in each division earns a playoff berth. GB is within the division.`,
  first: `<b>First Half</b> (final): locked first-half records. The ✦ club is its division's first-half champion and has ` +
    `clinched a playoff berth. Because some postponed first-half games count toward the second half, a club's first-half games may total fewer than 27.`,
  expw: `<b>EXP W</b>: W-L-PCT, runs scored/allowed, run differential, and Pythagorean expected wins. ` +
    `<b>Exp W</b> = [RS&sup2;/(RS&sup2;+RA&sup2;)] &times; games; <b>+/-Exp</b> = actual wins minus expected wins (whole games; + = ahead of pace, &minus; = behind).`,
  off: `<b>Offense</b>: AVG, OBP, OPS, RS, SB, batting walks (BB) and strikeouts (K). Data source: wclstats.com (Presto).`,
  pit: `<b>Pitching &amp; Defense</b>: ERA, RA, WHIP, staff strikeouts (K) and walks (BB), errors (E), fielding % (F%). Data source: wclstats.com (Presto).`
};

document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); tab=b.getAttribute('data-tab');
  if(isStanding(tab)){ sortKey='pct'; sortDir=-1; } else { [sortKey,sortDir]=STAT_DEFAULT[tab]; }
  render();
}));
document.querySelectorAll('.flt').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.flt').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); flt=b.getAttribute('data-flt'); render();
}));

document.getElementById('asof').textContent=ASOF;
render();
document.getElementById('cap').textContent=`Rendered ${new Date().toLocaleString()}`;
window.addEventListener('resize', postHeight);
window.addEventListener('load', postHeight);
</script>
</body>
</html>
